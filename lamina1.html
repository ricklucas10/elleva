<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELLEVA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital,wght@0,500;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #05050a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .slide {
    width: 960px;
    height: 540px;
    background: linear-gradient(160deg, #080814 0%, #05050d 50%, #0a0a18 100%);
    border-radius: 2px;
    display: flex;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 100px rgba(180, 150, 80, 0.04);
  }

  .photo-area {
    width: 58%;
    position: relative;
    overflow: hidden;
  }

  .photo-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
    filter: brightness(0.8) contrast(1.05) saturate(0.6);
  }

  .photo-area::after {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      linear-gradient(180deg, rgba(5,5,10,0.15) 0%, transparent 35%, transparent 70%, rgba(5,5,10,0.5) 100%),
      linear-gradient(90deg, rgba(5,5,10,0) 65%, rgba(5,5,10,0.35) 100%);
  }

  .text-area {
    width: 42%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 36px;
    gap: 22px;
    position: relative;
  }

  .name-block {
    line-height: 0.95;
  }

  .name-block .line1 {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    font-weight: 500;
    color: #d4c2a0;
    letter-spacing: 2px;
  }

  .name-block .line2 {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    font-weight: 500;
    color: #7a6c52;
    letter-spacing: 2px;
  }

  .separator {
    width: 24px;
    height: 1px;
    background: rgba(200, 165, 100, 0.3);
  }

  .phrase {
    font-size: 13px;
    font-weight: 300;
    color: rgba(190, 175, 150, 0.5);
    letter-spacing: 0.2px;
    line-height: 1.8;
    max-width: 270px;
  }

  .phrase i {
    color: rgba(200, 180, 150, 0.6);
  }

  .footnotes {
    position: absolute;
    bottom: 44px;
    right: 36px;
    display: flex;
    gap: 16px;
  }

  .footnotes a {
    color: rgba(180, 160, 130, 0.1);
    font-size: 10px;
    text-decoration: none;
  }

  .footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-top: 1px solid rgba(200, 165, 100, 0.03);
  }

  .footer-left {
    color: #c9a96e;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 5px;
  }

  .footer-right {
    color: rgba(180, 160, 130, 0.15);
    font-size: 7px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  
  /* === NAVEGACAO === */
  body { position: relative; }
  .nav-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(200, 165, 100, 0.5);
    font-size: 24px;
    text-decoration: none;
    border-radius: 3px;
    transition: all 0.3s;
    z-index: 100;
    cursor: pointer;
    border: 1px solid rgba(200, 165, 100, 0.1);
  }
  .nav-arrow:hover {
    color: #c9a96e;
    background: rgba(200, 165, 100, 0.1);
    border-color: rgba(200, 165, 100, 0.25);
  }
  .nav-prev { left: 20px; }
  .nav-next { right: 20px; }

</style>
</head>
