<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELLEVA — Apresentação Detalhada</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0} html,body{background:#050505;color:#fff;font-family:Arial,sans-serif;height:100%;overflow:hidden}
  .deck{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none}.deck::-webkit-scrollbar{display:none}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:#050505;position:relative}.slide img{display:block;width:min(100vw,177.777vh);height:auto;max-height:100vh;object-fit:contain;box-shadow:0 0 80px rgba(0,0,0,.55)}
  .counter{position:fixed;right:26px;bottom:23px;z-index:10;color:rgba(255,255,255,.58);font-size:11px;letter-spacing:2px;background:rgba(0,0,0,.52);border:1px solid rgba(201,169,110,.22);padding:9px 12px;border-radius:2px}.counter b{color:#c9a96e}
  .back{position:fixed;left:24px;top:24px;z-index:10;color:#c9a96e;text-decoration:none;font-size:11px;letter-spacing:2px;background:rgba(0,0,0,.52);border:1px solid rgba(201,169,110,.22);padding:9px 12px;border-radius:2px}.back:hover{color:#fff;border-color:#c9a96e}
  .hint{position:fixed;right:26px;top:24px;z-index:10;color:rgba(255,255,255,.4);font-size:10px;letter-spacing:1px}
</style>
</head><body>
<a class="back" href="lamina7_estrutura.html">← VOLTAR À NARRATIVA</a><div class="hint">USE ↑ ↓ OU ROLE PARA NAVEGAR</div><div class="counter"><b id="current">01</b> / 12</div>
<main class="deck" id="deck">
<section class="slide"><img alt="ELLEVA — capa" src="assets/pdf-original/page_01.png"></section>
<section class="slide"><img alt="O que é a ELLEVA" src="assets/pdf-original/page_02.png"></section>
<section class="slide"><img alt="Propósito da ELLEVA" src="assets/pdf-original/page_03.png"></section>
<section class="slide"><img alt="Mercado Internacional" src="assets/pdf-original/page_04.png"></section>
<section class="slide"><img alt="Parcerias com corretoras" src="assets/pdf-original/page_05.png"></section>
<section class="slide"><img alt="The Real One" src="assets/pdf-original/page_06.png"></section>
<section class="slide"><img alt="Segurança para grandes operações" src="assets/pdf-original/page_07.png"></section>
<section class="slide"><img alt="Plano de negócios e compensação" src="assets/pdf-original/page_08.png"></section>
<section class="slide"><img alt="Plano de carreira" src="assets/pdf-original/page_09.png"></section>
<section class="slide"><img alt="Regras do negócio" src="assets/pdf-original/page_10.png"></section>
<section class="slide"><img alt="Seus próximos passos" src="assets/pdf-original/page_11.png"></section>
<section class="slide"><img alt="ELLEVA — encerramento" src="assets/pdf-original/page_12.png"></section>
</main>
<script>
const deck=document.getElementById('deck'), slides=[...document.querySelectorAll('.slide')], current=document.getElementById('current');
new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)current.textContent=String(slides.indexOf(e.target)+1).padStart(2,'0')}),{root:deck,threshold:.65}).observe(slides[0]);
slides.slice(1).forEach(s=>new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)current.textContent=String(slides.indexOf(e.target)+1).padStart(2,'0')}),{root:deck,threshold:.65}).observe(s));
window.addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp'].includes(e.key))return;e.preventDefault();const i=slides.findIndex(s=>{const r=s.getBoundingClientRect();return r.top>=-window.innerHeight*.35&&r.top<window.innerHeight*.35});slides[Math.max(0,Math.min(slides.length-1,i+(e.key==='ArrowDown'?1:-1)))].scrollIntoView({behavior:'smooth'})});
</script>
</body></html>
